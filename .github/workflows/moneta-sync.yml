# Backup trigger for the Moneta sales sync. Supabase pg_cron is the primary
# scheduler (GitHub's free schedules fire every 4-7 h, not as written); the
# route itself enforces the 30 min day / 3 h night cadence.
# Needs repo secrets DASHBOARD_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
name: moneta-sync
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron/moneta-sync
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Tolerate pasted whitespace or a leading "NAME=" in the secrets.
          SECRET=$(printf '%s' "${CRON_SECRET#CRON_SECRET=}" | tr -d '[:space:]"')
          URL=$(printf '%s' "${DASHBOARD_URL#DASHBOARD_URL=}" | tr -d '[:space:]"')
          if [ -z "$SECRET" ] || [ -z "$URL" ]; then echo "DASHBOARD_URL or CRON_SECRET secret is empty"; exit 1; fi
          echo "Secret length: ${#SECRET} (should be 64)"
          curl --fail-with-body -sS --max-time 150 \
            -H "Authorization: Bearer ${SECRET}" \
            "${URL%/}/api/cron/moneta-sync"
